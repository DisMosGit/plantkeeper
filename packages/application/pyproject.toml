[project]
name = "plantkeeper-application"
version = "0.1.0"
description = "Application layer: commands, queries, sagas and ports."
requires-python = ">=3.14"
dependencies = [
    "plantkeeper-domain",
    "python-cqrs>=4.13",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plantkeeper.application"

[tool.uv.sources]
plantkeeper-domain = { workspace = true }
