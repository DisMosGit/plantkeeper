# PlantKeeper — local infrastructure.
#
# Kafka runs in KRaft mode (no Zookeeper), two Postgres instances hold the write schemas
# and the read side's schemas (one database per side: the read path stops competing with
# writes, and a projection rebuild can never touch a write table), Valkey serves the cache
# and pub/sub, Redpanda Console is the Kafka UI. Bring everything up with `make dev`, tear
# it down (with volumes) with `make clean`.
#
# The split is configuration, not code: pointing `READ_POSTGRES_*` at the write instance
# collapses it back into one database. That rollback, and the rest of the topology, is
# documented in `docs/runbooks/local-topology.md`.
#
# Connection settings can be overridden through a local `.env` file (see `.env.example`).

name: plantkeeper

services:
  # --- Kafka (single node, KRaft, no Zookeeper) -------------------------------
  # Two plaintext listeners: PLAINTEXT_HOST for processes on the host
  # (localhost:9092) and PLAINTEXT for containers (kafka:29092).
  kafka:
    image: apache/kafka:4.1.1
    container_name: plantkeeper-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # The host is a laptop-sized machine; keep the broker JVM small.
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    volumes:
      # /var/lib/kafka is pre-owned by the image's `appuser`, so a fresh named
      # volume inherits writable ownership.
      - kafka-data:/var/lib/kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # --- Postgres (write schemas) -----------------------------------------------
  # Postgres 18 keeps its data in /var/lib/postgresql/18/docker and declares the
  # volume at /var/lib/postgresql, so the named volume is mounted there.
  postgres:
    image: postgres:18-alpine
    container_name: plantkeeper-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plantkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plantkeeper}
      POSTGRES_DB: ${POSTGRES_DB:-plantkeeper}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-plantkeeper} -d ${POSTGRES_DB:-plantkeeper}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Postgres (the read side's own instance: read_analytics) ----------------
  # A second instance rather than a second schema, so a projection rebuild and the
  # admin's queries cannot compete with — or accidentally touch — the write tables.
  # Same image, same credentials, a different port: the only thing that distinguishes
  # the two URLs, which is what makes pointing both at one instance a one-line change.
  postgres-read:
    image: postgres:18-alpine
    container_name: plantkeeper-postgres-read
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${READ_POSTGRES_USER:-plantkeeper}
      POSTGRES_PASSWORD: ${READ_POSTGRES_PASSWORD:-plantkeeper}
      POSTGRES_DB: ${READ_POSTGRES_DB:-plantkeeper}
    volumes:
      - postgres-read-data:/var/lib/postgresql
      - ./docker/postgres-read/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${READ_POSTGRES_USER:-plantkeeper} -d ${READ_POSTGRES_DB:-plantkeeper}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # --- Valkey (cache, notification pub/sub) ----------------------------------
  # No persistence in development: nothing to keep between runs.
  valkey:
    image: valkey/valkey:9-alpine
    container_name: plantkeeper-valkey
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # --- Redpanda Console (Kafka UI) -------------------------------------------
  console:
    image: redpandadata/console:v3.2.2
    container_name: plantkeeper-console
    environment:
      KAFKA_BROKERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  kafka-data:
  postgres-data:
  postgres-read-data:
