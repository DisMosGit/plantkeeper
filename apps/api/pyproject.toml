[project]
name = "plantkeeper-api"
version = "0.1.0"
description = "FastAPI REST API and gRPC servicers."
requires-python = ">=3.14"
dependencies = [
    "plantkeeper-application",
    "plantkeeper-infrastructure",
    "dishka>=1.10",
    "fastapi>=0.141",
    "grpcio>=1.84",
    "grpcio-health-checking>=1.84",
    "grpcio-reflection>=1.84",
    "protobuf>=7.35.1",
    "pydantic>=2.13",
    "python-cqrs>=4.13",
    "uvicorn[standard]>=0.53",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plantkeeper.api"

[tool.uv.sources]
plantkeeper-application = { workspace = true }
plantkeeper-infrastructure = { workspace = true }
