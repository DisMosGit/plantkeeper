[project]
name = "plantkeeper-workers"
version = "0.1.0"
description = "FastStream consumers: the outbox relay, the saga consumers and their timers."
requires-python = ">=3.14"
dependencies = [
    "plantkeeper-application",
    "plantkeeper-infrastructure",
    "dishka>=1.10",
    "faststream[kafka]>=0.7.6",
    "python-cqrs>=4.13",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "plantkeeper.workers"

[tool.uv.sources]
plantkeeper-application = { workspace = true }
plantkeeper-infrastructure = { workspace = true }
