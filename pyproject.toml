[project]
name = "plantkeeper"
version = "0.1.0"
description = "Event-driven plant care platform: DDD + CQRS + Event Sourcing."
readme = "README.md"
authors = [
    { name = "DisMosGit", email = "DisSurgu@ya.ru" }
]
requires-python = ">=3.14"
dependencies = []

# The repository root is a workspace root, not an installable package:
# only the members under packages/, apps/ and tools/ are built and installed.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*", "tools/*"]

[dependency-groups]
dev = [
    # Alembic is a developer/operator tool (`make migrate`), not something the
    # running services import: the write-side services only need SQLAlchemy.
    "alembic>=1.20.0",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers>=4.15.0",
]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = [
    "packages/domain/src",
    "packages/application/src",
    "packages/infrastructure/src",
    "apps/api/src",
    "apps/admin/src",
    "apps/workers/src",
    "tools/iot-simulator/src",
    "tests",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ANN", "RUF", "PTH"]
# `Any` is banned by AGENTS.md; ANN401 would only duplicate that rule while making
# unavoidable third-party boundary annotations noisy.
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["plantkeeper"]

[tool.ruff.lint.per-file-ignores]
# Django's declarative class attributes — ``Meta.indexes``, ``Meta.ordering``,
# a migration's ``operations`` — are mutable by design: Django's metaclasses read
# them and build the immutable runtime state themselves. RUF012 would have every
# one of them annotated ``ClassVar``, which is noise Django never asks for.
"apps/admin/src/plantkeeper/admin/read_models/**" = ["RUF012"]

# -----------------------------------------------------------------------------
# Mypy (strict)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Pydantic models carry the domain's data; the plugin checks their generated
# `__init__` signatures instead of falling back to `**data: Any`.
plugins = ["pydantic.mypy"]
# `plantkeeper` is a namespace package assembled from every workspace member, so
# mypy has to be told where each portion starts: without these two options it
# resolves `plantkeeper.*` imports through the (untyped) installed packages.
namespace_packages = true
explicit_package_bases = true
mypy_path = [
    "packages/domain/src",
    "packages/application/src",
    "packages/infrastructure/src",
    "apps/api/src",
    "apps/admin/src",
    "apps/workers/src",
    "tools/iot-simulator/src",
]
# `uv run mypy .` must not descend into the virtualenv.
exclude = ['^\.venv/', '^build/', '^dist/']

# `python-cqrs` ships no `py.typed` marker, so a strict build refuses to analyse
# it (`import-untyped`). It is used at exactly two seams — the command/query
# dispatch and its DTO base classes — and the reasons are recorded in
# `docs/adr/0003-write-side-outbox.md`.
[[tool.mypy.overrides]]
module = ["cqrs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Consequence of the override above: cqrs's base classes are `Any`, and strict
# mode refuses to subclass `Any` (`disallow_subclassing_any`). Only the modules
# that declare those base classes are relaxed; every concrete command, response
# and handler is typed against them, so the rest of the project stays strict.
module = [
    "plantkeeper.application.commands.base",
    "plantkeeper.application.queries.base",
    "plantkeeper.application.views",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# `aiokafka` ships no `py.typed` marker either. The services never import it —
# FastStream does — so this only affects the tests that consume Kafka directly to
# assert what the relay published.
module = ["aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Django ships no `py.typed` marker, so `models.Model`, the managers and
# `ModelAdmin` are `Any` to a strict build. Only `apps/admin` (the read side)
# imports it, and its own code — settings, projections, admin wiring — is fully
# annotated; `django-stubs` would type the framework but adds a mypy plugin that
# has to track Django's release cadence. See docs/adr/0004-read-side-projections.md.
module = ["django.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Consequence of the override above: strict mode refuses to subclass `Any`
# (`disallow_subclassing_any`), and the read models, the middleware and the
# `ModelAdmin` classes all subclass Django's `Any` base classes. Only the admin
# app is relaxed; every field and every function is annotated by hand.
module = ["plantkeeper.admin.*"]
disallow_subclassing_any = false

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: needs Docker (testcontainers)",
    "slow: end-to-end test through docker compose",
]

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["plantkeeper"]

[tool.coverage.report]
show_missing = true
# The per-layer floors (domain 90%, application 80%, infrastructure 70%) are
# enabled in Phase 10; a non-zero floor would fail `make test` on the skeleton.
fail_under = 0

# -----------------------------------------------------------------------------
# import-linter (run with `uv run lint-imports`)
# -----------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["plantkeeper"]
# Needed for the `forbidden` contracts that name third-party modules.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: apps -> infrastructure -> application -> domain"
type = "layers"
# A layer is a single string; `|` separates independent modules in that layer.
layers = [
    "plantkeeper.api | plantkeeper.admin | plantkeeper.workers",
    "plantkeeper.infrastructure",
    "plantkeeper.application",
    "plantkeeper.domain",
]

[[tool.importlinter.contracts]]
name = "Domain layer has no infrastructure dependencies"
type = "forbidden"
source_modules = ["plantkeeper.domain"]
forbidden_modules = [
    "plantkeeper.application",
    "plantkeeper.infrastructure",
    "sqlalchemy",
    "fastapi",
    "django",
    "dishka",
    "aiokafka",
    "faststream",
    "valkey",
    "httpx",
    "grpc",
    "cqrs",
]

[[tool.importlinter.contracts]]
name = "Domain bounded contexts are independent"
type = "independence"
# Contexts share only the kernel (`plantkeeper.domain.base`,
# `.identifiers`, `.values`) and communicate through Kafka events, never by
# importing each other. See docs/adr/0002-bounded-contexts.md.
modules = [
    "plantkeeper.domain.garden",
    "plantkeeper.domain.care",
    "plantkeeper.domain.catalog",
    "plantkeeper.domain.journal",
    "plantkeeper.domain.telemetry",
    "plantkeeper.domain.notifications",
    "plantkeeper.domain.identity",
]

[[tool.importlinter.contracts]]
name = "IoT simulator stays independent of the application layers"
type = "forbidden"
source_modules = ["plantkeeper.iot_simulator"]
forbidden_modules = [
    "plantkeeper.domain",
    "plantkeeper.application",
    "plantkeeper.infrastructure",
]
