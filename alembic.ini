# PlantKeeper — Alembic configuration.
#
# The database URL is deliberately absent: `alembic/env.py` builds it from
# `plantkeeper.infrastructure.config.Settings`, so migrations read the same
# `.env` as the services and no credential is ever committed. A test that needs
# a different database sets `sqlalchemy.url` on the Config object in code.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Revision ids are sequential (`0001`, `0002`, …) instead of hashes: at this
# scale a readable order is worth more than collision resistance.
file_template = %%(rev)s_%%(slug)s
timezone = UTC
